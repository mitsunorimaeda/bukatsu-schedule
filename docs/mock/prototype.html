<title>部活予定表 モック</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 配色: 紙の予定表の白地に、職員室の赤ペン・蛍光マーカーを差し色にする。レイアウト: 左に「カレンダー」の目次、中央に月間表、右に作業パネル */
:root{
  --bg:#f7f6f2; --paper:#ffffff; --fg:#1f2328; --muted:#6b6f76; --line:#dcd9d1; --head:#efede6;
  --ink:#1d3f8a; --ink-soft:#e8edf9; --red:#c0392b; --marker:#fff3a8; --added:#dff5e3; --removed:#fde2e0;
  --sat:#eef3fb; --sun:#fbeeec;
  --font:'Zen Kaku Gothic New',-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15171b;--paper:#1d2026;--fg:#e8e6e1;--muted:#9a9ea6;--line:#333842;--head:#252932;--ink:#8fb0ff;--ink-soft:#23304d;--red:#ff8a7a;--marker:#5a4f12;--added:#1f4a2c;--removed:#5a2622;--sat:#1f2733;--sun:#33221f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171b;--paper:#1d2026;--fg:#e8e6e1;--muted:#9a9ea6;--line:#333842;--head:#252932;--ink:#8fb0ff;--ink-soft:#23304d;--red:#ff8a7a;--marker:#5a4f12;--added:#1f4a2c;--removed:#5a2622;--sat:#1f2733;--sun:#33221f;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 12px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ghost{border-color:transparent;background:transparent}
button.danger{color:var(--red)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input,select,textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--paper);width:100%}
h1,h2,h3{margin:0;text-wrap:balance}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:700;color:var(--ink);letter-spacing:.02em}
.brand small{font-weight:400;color:var(--muted);margin-left:6px}
.crumb{color:var(--muted)}
.spacer{flex:1}
.mocktag{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:1px 8px}
.layout{display:grid;grid-template-columns:264px 1fr;min-height:0}
.side{border-right:1px solid var(--line);padding:12px 14px;overflow:auto;background:var(--paper)}
.side h2{font-size:12px;color:var(--muted);letter-spacing:.06em;margin:10px 0 6px}
.main{overflow:auto;padding:12px 16px;min-width:0}
/* 目次: 行ごとに同じ格子（チェック | 色 | 名前 | 件数 | 設定）に揃える */
.cal{margin:0 0 6px;border-bottom:1px solid var(--line);padding-bottom:6px}
.cal:last-of-type{border-bottom:none}
.cal .row{display:grid;grid-template-columns:18px 12px 1fr 3em 24px;align-items:center;gap:6px;min-height:28px}
.cal .row input{margin:0;width:16px;height:16px}
.cal .row .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .row .n{color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.cal .row .gear{padding:0;width:24px;height:24px;line-height:22px;text-align:center;color:var(--muted);border-color:transparent}
.cal .row .gear:hover{border-color:var(--line)}
.cal .sw{width:12px;height:12px;border-radius:3px}
.cal .slot{grid-template-columns:18px 12px 1fr 3em 24px;min-height:24px;margin-left:0}
.cal .slot .name{font-weight:400;color:var(--fg)}
.cal .slot .sw{visibility:hidden}
.cal .allnone{grid-column:3/-1;display:flex;gap:8px;font-size:11px;color:var(--muted);margin:2px 0 2px}
.cal .allnone button{border:none;background:none;padding:0;color:var(--ink);font-size:11px}
.cal .ver{margin:4px 0 0 36px;display:grid;gap:4px;font-size:12px;color:var(--muted)}
.cal .ver select{font-size:12px;padding:3px 6px}
.cal .ver label{display:grid;grid-template-columns:16px 1fr;align-items:center;gap:6px;color:var(--fg);white-space:nowrap}
.cal .ver input{margin:0}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.toolbar .month{font-weight:700;font-size:16px;min-width:6.5em;text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:10px;color:var(--muted);font-size:12px;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:3px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
table.month{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-variant-numeric:tabular-nums}
table.month th,table.month td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
table.month thead th{background:var(--head);position:sticky;top:0;z-index:2;font-weight:500}
table.month thead tr.cals th{text-align:center;font-weight:700}
table.month thead tr.slots th{top:29px;color:var(--muted);font-size:12px}
table.month td.d,table.month td.w{position:sticky;background:var(--paper);z-index:1;white-space:nowrap}
table.month td.d{left:0;width:2.8em;text-align:right}
table.month td.w{left:2.8em;width:2.4em}
table.month th.fx{position:sticky;left:0;z-index:3}
table.month th.fx.w{left:2.8em}
tr.sat td.d,tr.sat td.w{background:var(--sat)} tr.sun td.d,tr.sun td.w{background:var(--sun)}
td.cell{min-width:10em;max-width:20em;cursor:cell}
td.cell:hover{background:var(--ink-soft)}
td.cell.editing{outline:2px solid var(--ink);outline-offset:-2px}
/* 班をまたぐ予定: 横につながった 1 マス。PDF の結合セルと同じ見え方 */
td.cell.shared{background:var(--marker);text-align:center;font-weight:500}
td.cell.shared .span{font-weight:400;color:var(--muted);font-size:11px}
td.cell.shared:hover{filter:brightness(.97)}
.ev{margin:1px 0;line-height:1.35}
.ev .t{color:var(--muted);margin-right:4px;font-family:var(--mono);font-size:12px}
.ev .p{color:var(--muted);margin-left:4px}
.ev.k-off,.ev.k-self,.ev.k-holiday{color:var(--muted)}
.ev.k-exam,.ev.k-pause{color:#9a5b00;font-weight:600}
.ev.k-match,.ev.k-competition{color:var(--red)}
.ev.added{background:var(--added)} .ev.changed{background:var(--marker)} .ev.removed{background:var(--removed);text-decoration:line-through;color:var(--muted)}
.ev .before{text-decoration:line-through;color:var(--muted);margin-right:4px}
/* 日をまたぐ予定: 左に帯。開始日は上が角、継続日は帯だけ、最終日は下が角 */
.ev.sp-start,.ev.sp-mid,.ev.sp-end{border-left:3px solid currentColor;padding-left:5px;margin-left:-8px;opacity:.95}
.ev.sp-start{border-top-left-radius:3px}.ev.sp-end{border-bottom-left-radius:3px}
.ev.sp-mid{color:var(--muted)}
.ev .span{color:var(--muted);font-size:11px}
/* 下書き: 点線枠。編集者だけに見える */
.ev.draft{border:1px dashed var(--muted);border-radius:4px;padding:0 4px;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(0,0,0,.03) 5px 6px)}
.badge.draftb{color:#7c3aed;border-color:#7c3aed}
.pubbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:2px 0 4px 36px;flex-wrap:wrap}
.pubbar .dot{width:8px;height:8px;border-radius:50%;background:#d97706;display:inline-block}
.pubbar button{padding:2px 8px;font-size:12px}
.badge{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;border:1px solid currentColor;margin-left:4px;vertical-align:middle}
.hint{color:var(--muted);font-size:12px}
.empty{border:2px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted);background:var(--paper)}
.empty h3{color:var(--fg);font-size:16px;margin-bottom:6px}
.empty .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.panel{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-6px 0 20px rgba(0,0,0,.08);padding:14px 16px;overflow:auto;z-index:20;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.panel h3{font-size:15px;margin-bottom:6px}
.panel .close{position:absolute;right:10px;top:8px}
.form{display:grid;gap:8px}
.form label{display:grid;gap:3px;font-size:12px;color:var(--muted)}
.form label.row{display:flex;align-items:center;gap:6px;color:var(--fg);font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choices{display:grid;gap:6px}
.choice{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.choice.on{border-color:var(--ink);background:var(--ink-soft)}
.choice b{display:block}
.choice small{color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.drop.on{border-color:var(--ink);background:var(--ink-soft)}
.progress{height:8px;background:var(--head);border-radius:4px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--ink);width:0;transition:width .3s}
table.plain{border-collapse:collapse;width:100%;font-size:13px}
table.plain th,table.plain td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
table.plain th{color:var(--muted);font-weight:500;font-size:12px}
table.plain td[contenteditable]{outline:none;border-left:3px solid transparent}
table.plain td[contenteditable]:focus{border-left-color:var(--ink);background:var(--ink-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:700}
.url{font-family:var(--mono);font-size:12px;background:var(--head);padding:6px 8px;border-radius:6px;word-break:break-all;display:flex;gap:6px;align-items:center}
.url span{flex:1}
.notice{background:var(--marker);border-radius:6px;padding:6px 10px;margin:6px 0;font-size:13px}
.pending{border:1px solid var(--line);border-left:4px solid var(--red);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:var(--paper)}
.home{max-width:760px;margin:0 auto;padding:24px 16px}
.home h1{font-size:24px;margin-bottom:4px}
.home .lead{color:var(--muted);margin-bottom:20px}
.wsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ws{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--paper);cursor:pointer;text-align:left}
.ws:hover{border-color:var(--ink)}
.ws b{font-size:15px}
.ws .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{font-size:11px;padding:1px 7px;border-radius:999px;color:#fff}
.ws.new{border-style:dashed;color:var(--muted);display:flex;align-items:center;justify-content:center;min-height:110px}
/* PDF プレビュー: 用紙の実寸（96dpi 換算）で描き、入れ物の幅に合わせて縮小する */
.pagewrap{position:relative;overflow:hidden;margin:0 auto 12px}
.page{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#fff;color:#1f2328;box-shadow:0 2px 12px rgba(0,0,0,.18);padding:34px 38px;box-sizing:border-box;font-family:var(--font);display:flex;flex-direction:column}
.page h4{margin:0 0 8px;font-size:16px;font-weight:700;letter-spacing:.02em}
.page .sub{font-size:10px;color:#555;margin-bottom:8px;display:flex;gap:14px}
.page table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10.5px;line-height:1.3}
.page th,.page td{border:1px solid #9a9a9a;padding:3px 5px;vertical-align:top;text-align:left;overflow:hidden}
.page th{background:#ececec;font-weight:600;text-align:center}
.page thead th.calhead{border-top:3px solid var(--c,#888);background:#f4f4f4}
.page thead th.slothead{font-weight:500;color:#444;background:#f9f9f9;font-size:10px}
/* 日付列: 折り返さない幅を確保し、日と曜日を揃える */
.page col.daycol{width:62px}
.page td.d{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:left;padding-left:6px}
.page td.d b{font-weight:700;font-size:11.5px}
.page td.d span{color:#555;margin-left:3px}
.page td.d .mon{display:block;font-size:9px;color:#777;line-height:1}
/* 土日は行全体をうすく。週の終わり（日曜）の下は太線で区切る */
.page tr.sat td{background:#f1f5fc}.page tr.sun td{background:#fcf1ef}
.page tr.sun td{border-bottom:2px solid #666}
.page tr.sat td.shared,.page tr.sun td.shared,.page td.shared{background:#fff3b0;text-align:center}
.page td.empty{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.025) 6px 7px)}
.page .foot{margin-top:auto;font-size:9px;color:#666;display:flex;justify-content:space-between;padding-top:6px}
/* 1 件 = 時刻の行 + 内容の行 + 場所（小さく灰色）。種類で色分け */
.page .ev{margin:0 0 2px;line-height:1.25;page-break-inside:avoid}
.page .ev .t{display:block;font-family:var(--mono);font-size:9.5px;color:#333;font-weight:500}
.page .ev .pl{display:block;color:#666;font-size:9px}
.page .ev.k-off,.page .ev.k-self,.page .ev.k-holiday{color:#777}
.page .ev.k-match,.page .ev.k-competition{color:#9b1c1c;font-weight:600}
.page .ev.k-exam,.page .ev.k-pause{color:#8a5a00;font-weight:600}
.page .ev .cont{color:#777;font-weight:400;font-size:9px}
/* 初回の案内（ガイドツアー）: 対象を明るく残して、吹き出しで 1 手順ずつ */
.tour-dim{position:fixed;inset:0;z-index:60;pointer-events:none}
.tour-ring{position:fixed;border:2px solid var(--ink);border-radius:8px;box-shadow:0 0 0 9999px rgba(20,22,26,.45);z-index:61;pointer-events:none;transition:all .25s}
.tour-box{position:fixed;z-index:62;background:var(--paper);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:300px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tour-box .step{font-size:11px;color:var(--muted);margin-bottom:4px}
.tour-box h4{margin:0 0 4px;font-size:14px}
.tour-box p{margin:0 0 10px;font-size:13px;line-height:1.5}
.tour-box .acts{display:flex;gap:6px;align-items:center}
.welcome{border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:10px;padding:14px 16px;background:var(--paper);margin-bottom:18px;display:grid;gap:8px}
.welcome .acts{display:flex;gap:8px;flex-wrap:wrap}
.howto h4{font-size:13px;margin:14px 0 4px;color:var(--ink)}
.howto ol,.howto ul{margin:0;padding-left:18px;line-height:1.7}
.howto details{border:1px solid var(--line);border-radius:6px;padding:6px 10px;margin:4px 0}
.howto summary{cursor:pointer;font-weight:500}
.pdfmodal{position:fixed;inset:0;background:rgba(20,22,26,.72);z-index:40;overflow:auto;padding:20px 24px 40px;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.pdfmodal .bar{position:sticky;top:0;display:flex;gap:10px;align-items:center;color:#fff;margin-bottom:14px;z-index:1}
.pdfmodal .bar button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.pdfmodal .bar select{width:auto;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.pdfmodal .bar option{color:#1f2328}
.steps{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;margin-bottom:8px;flex-wrap:wrap}
.steps b{color:var(--ink)}
.members li{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.members .who{flex:1;min-width:0}
.members small{color:var(--muted);display:block}
.editor{position:absolute;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:10px;width:280px;z-index:30}
.editor .form{gap:6px}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--muted)}
/* 班の選択: どの画面でも同じ格子（見出し行 + 等幅の列、各行はチェック | 名前） */
.slotpick{display:grid;gap:4px}
.slotpick .head{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);min-height:20px}
.slotpick .head .acts{margin-left:auto;display:flex;gap:8px}
.slotpick .head .acts button{border:none;background:none;padding:0;color:var(--ink);font-size:11px}
.slotpick .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:2px 12px}
.slotpick .grid label{display:grid;grid-template-columns:16px 1fr;align-items:center;gap:6px;min-height:24px;font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotpick .grid input{margin:0;width:16px;height:16px}
.slotpick .grid label.sel{color:var(--ink);font-weight:500}
.gcal{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--paper)}
@media (max-width:760px){.layout{grid-template-columns:1fr}.side{border-right:none;border-bottom:1px solid var(--line);max-height:40vh}.panel{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>

<script>
/* ========== データ（試作用。名電の実データから抜粋） ========== */
const KINDS = {practice:'練習',match:'試合',competition:'大会',off:'休み',self:'各自練習',pause:'テスト期間',event:'行事',exam:'考査',holiday:'休日',school:'学校行事',external:'外部予定'};
const KIND_ORDER = ['practice','match','competition','off','self','pause','event','external','school','exam','holiday'];
/* time = 開始、end = 終了（空なら開始 + 2 時間を表示時に補う）。両方空なら終日。endDate があれば日をまたぐ予定 */
function E(date,slot,kind,title,time,place,end,endDate){return {id:'e'+Math.random().toString(36).slice(2,8),date,slot,kind,title,time:time||'',end:end||'',place:place||'',endDate:endDate||''}}
function covers(e,d){return e.date<=d&&(e.endDate||e.date)>=d}
/* 公開の制御。
   - 予定ごとの「下書き（仮）」: 編集者だけに見え、リンク・ICS・PDF には出ない
   - カレンダーごとの公開のしかた: 自動（保存したら反映）/ 手動（「公開する」を押した内容だけ反映）
   公開中の内容 = 手動なら最後に公開したスナップショット、自動なら下書き以外 */
function publicEvents(c){if(c.publishMode==='manual')return (c.published||[]).filter(e=>!e.draft);return eventsOf(c).filter(e=>!e.draft)}
function publicView(c,slots){return {...c,slots:slots||c.slots,events:publicEvents(c),versions:[]}}
function unpublishedChanges(c){if(c.publishMode!=='manual')return [];const pub=new Map((c.published||[]).map(e=>[e.id,e]));const out=[];const work=eventsOf(c).filter(e=>!e.draft);
  for(const e of work){const p=pub.get(e.id);if(!p)out.push({type:'added',after:e});else if(JSON.stringify([p.title,p.time,p.end,p.date,p.endDate,p.place,p.kind,p.slot,p.slots])!==JSON.stringify([e.title,e.time,e.end,e.date,e.endDate,e.place,e.kind,e.slot,e.slots]))out.push({type:'changed',before:p,after:e})}
  for(const [id,p] of pub)if(!work.some(e=>e.id===id))out.push({type:'removed',before:p});return out}
function draftCount(c){return eventsOf(c).filter(e=>e.draft).length}
function publishNow(c){c.published=eventsOf(c).filter(e=>!e.draft).map(e=>JSON.parse(JSON.stringify(e)));c.publishedAt=new Date().toISOString()}

/* 用紙サイズ（96dpi の px）。A4 横 297×210mm など */
const PAPERS={'A4 横':{w:1123,h:794},'A4 縦':{w:794,h:1123},'A3 横':{w:1587,h:1123}};
function datesBetween(from,to){const out=[];const d=new Date(from+'T00:00:00');const end=new Date(to+'T00:00:00');while(d<=end&&out.length<400){out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);d.setDate(d.getDate()+1)}return out}
function fmtRange(from,to){const f=(s)=>`${Number(s.slice(0,4))}年${Number(s.slice(5,7))}月${Number(s.slice(8,10))}日`;return `${f(from)}〜${f(to)}`}
function pdfCellText(e,d){const p=spanPart(e,d);const t=p==='single'&&e.time?`<span class="t">${h(e.time)}${e.end?'〜'+h(e.end):''}</span>`:p==='start'&&e.time?`<span class="t">${h(e.time)}〜</span>`:p==='end'&&e.end?`<span class="t">〜${h(e.end)}</span>`:'';
  const tail=p==='start'?`<span class="cont">（〜${md(e.endDate)}）</span>`:p==='mid'?`<span class="cont">（${dayIndex(e,d)}日目）</span>`:p==='end'?'<span class="cont">（最終日）</span>':'';
  return `<div class="ev k-${e.kind}">${t}${h(e.title)}${tail}${e.place&&p!=='mid'?`<span class="pl">＠${h(e.place)}</span>`:''}</div>`}
function pdfDayCell(d,showMonth){return `<td class="d">${showMonth?`<span class="mon">${Number(d.slice(5,7))}月</span>`:''}<b>${Number(d.slice(8,10))}</b><span>${WD[wd(d)]}</span></td>`}
/* ページ割り: 行の高さを中身（最も多いマスの行数）から見積もり、ページの高さに収まる分だけ入れる。日曜で切れるときは週単位で切る */
function estimateRowH(cals,d,rowH){let lines=1;for(const c of cals)for(const cell of rowCells(c,d,c.slots,eventsOf(c))){let n=0;for(const e of cell.events){n+=(e.time||e.end?1:0)+Math.ceil((e.title.length+(e.endDate?6:0))/9)+(e.place?1:0)}lines=Math.max(lines,n)}return Math.max(rowH,lines*13+8)}
function chunkDays(days,availH,cals,rowH){const chunks=[];let cur=[],used=0;for(const d of days){const hh=estimateRowH(cals,d,rowH);if(cur.length&&used+hh>availH){chunks.push(cur);cur=[];used=0}cur.push(d);used+=hh;if(wd(d)===0&&used>availH*0.8){chunks.push(cur);cur=[];used=0}}if(cur.length)chunks.push(cur);return chunks}
/* ページの配列を返す。layout: 月間表 / 週間 / 一覧 */
function renderPdfPages(cals,from,to,layout,paper){
  const P=PAPERS[paper]||PAPERS['A4 横'];const days=datesBetween(from,to);
  const cols=cals.flatMap(c=>c.slots.map(s=>({c,s})));
  const rowH=layout==='一覧'?18:(P.h>P.w?26:24);const availH=P.h-34*2-110;
  const chunks=layout==='週間'?(()=>{const out=[];let cur=[];for(const d of days){cur.push(d);if(wd(d)===0){out.push(cur);cur=[]}}if(cur.length)out.push(cur);return out})()
    :layout==='一覧'?(()=>{const out=[];let cur=[],used=0;for(const d of days){const n=Math.max(1,cals.reduce((a,c)=>a+eventsOf(c).filter(e=>covers(e,d)).length,0));if(cur.length&&used+n*rowH>availH){out.push(cur);cur=[];used=0}cur.push(d);used+=n*rowH}if(cur.length)out.push(cur);return out})()
    :chunkDays(days,availH,cals,rowH);
  const title=`${h(ws().name)}　予定表`;const sub=`${fmtRange(from,to)}　${cals.map(c=>h(c.name)).join('・')}`;
  const versions=cals.map(c=>curVersion(c)?`${h(c.name)}: ${h(curVersion(c).label)}`:'').filter(Boolean).join('　');
  const pages=chunks.map((ds,pi)=>{
    let body='';
    if(layout==='一覧'){body=`<table><colgroup><col class="daycol"><col style="width:9em"><col style="width:7em"><col style="width:8em"><col><col style="width:8em"></colgroup><thead><tr><th>日</th><th>カレンダー</th><th>班</th><th>時刻</th><th>内容</th><th>場所</th></tr></thead><tbody>${ds.flatMap(d=>{let first=true;return cals.flatMap(c=>eventsOf(c).filter(e=>covers(e,d)).map(e=>{const p=spanPart(e,d);const row=`<tr class="${wd(d)===0?'sun':wd(d)===6?'sat':''}">${first?pdfDayCell(d,d.endsWith('-01')||d===ds[0]):'<td class="d"></td>'}<td>${h(c.name)}</td><td>${slotsOf(e,c).length===c.slots.length&&c.slots.length>1?'全班':slotsOf(e,c).join('・')}</td><td>${e.time?h(e.time)+(e.end?'〜'+h(e.end):''):'終日'}</td><td>${h(e.title)}${p==='start'?'（〜'+md(e.endDate)+'）':p==='mid'?'（'+dayIndex(e,d)+'日目）':p==='end'?'（最終日）':''}</td><td>${h(e.place||'')}</td></tr>`;first=false;return row}))}).join('')}</tbody></table>`}
    else{body=`<table><colgroup><col class="daycol">${cols.map(()=>'<col>').join('')}</colgroup><thead><tr><th rowspan="2">日</th>${cals.map(c=>`<th colspan="${c.slots.length}" class="calhead" style="--c:${c.color}">${h(c.name)}</th>`).join('')}</tr><tr>${cols.map(({c,s})=>`<th class="slothead">${c.slots.length>1?h(s):'　'}</th>`).join('')}</tr></thead>
      <tbody>${ds.map((d,i)=>`<tr class="${wd(d)===0?'sun':wd(d)===6?'sat':''}" style="height:${rowH}px">${pdfDayCell(d,i===0||d.endsWith('-01'))}${cals.map(c=>rowCells(c,d,c.slots,eventsOf(c)).map(cell=>`<td ${cell.span>1?`colspan="${cell.span}" class="shared"`:cell.events.length?'':'class="empty"'}>${cell.events.map(e=>pdfCellText(e,d)).join('')}</td>`).join('')).join('')}</tr>`).join('')}</tbody></table>`}
    return `<div class="pagewrap" data-pw="${P.w}" data-ph="${P.h}"><div class="page" style="width:${P.w}px;height:${P.h}px"><h4>${title}</h4><div class="sub"><span>${sub}</span><span>${layout}</span></div>${body}<div class="foot"><span>版: ${versions}</span><span>作成 2026-10-17　${pi+1} / ${chunks.length} ページ　${paper}</span></div></div></div>`});
  return pages.join('');
}

function fitPages(root){root.querySelectorAll('.pagewrap').forEach(w=>{const pw=Number(w.dataset.pw),ph=Number(w.dataset.ph);w.style.width='';const avail=w.parentElement.clientWidth;const s=Math.min(1,avail/pw);const pg=w.querySelector('.page');pg.style.transform=`scale(${s})`;w.style.width=(pw*s)+'px';w.style.height=(ph*s)+'px'})}

function renderPdfModal(){const m=state.pdfModal;if(!m)return '';const w=ws();const cals=w.calendars.filter(c=>m.sel.has(c.id)).map(c=>publicView(c,m.slotSel&&m.slotSel[c.id]?c.slots.filter(s=>m.slotSel[c.id].includes(s)):c.slots)).filter(c=>c.slots.length);

/* 班の選択 UI。cls = チェックボックスの class、isOn(x) で初期状態 */
function slotPick(cls,slots,isOn,title,allId,noneId){return `<div class="slotpick"><div class="head"><span>${h(title)}</span><span class="acts"><button type="button" ${allId?`id="${allId}"`:''} data-pickall="${cls}">全部</button><button type="button" ${noneId?`id="${noneId}"`:''} data-picknone="${cls}">なし</button></span></div><div class="grid">${slots.map(x=>`<label class="${isOn(x)?'sel':''}"><input type="checkbox" class="${cls}" value="${h(x)}" ${isOn(x)?'checked':''}><span>${h(x)}</span></label>`).join('')}</div></div>`}
function bindSlotPicks(root){root.querySelectorAll('[data-pickall]').forEach(b=>b.onclick=e=>{e.preventDefault();root.querySelectorAll('.'+b.dataset.pickall).forEach(x=>{x.checked=true;x.closest('label').classList.add('sel')})});root.querySelectorAll('[data-picknone]').forEach(b=>b.onclick=e=>{e.preventDefault();root.querySelectorAll('.'+b.dataset.picknone).forEach(x=>{x.checked=false;x.closest('label').classList.remove('sel')})});root.querySelectorAll('.slotpick input').forEach(x=>x.addEventListener('change',()=>x.closest('label').classList.toggle('sel',x.checked)))}
function changeLine(x){const e=x.after||x.before;if(x.type==='added')return md(e.date)+' '+e.slot+': 追加 '+e.title;if(x.type==='removed')return md(e.date)+' '+e.slot+': 取消 '+e.title;return md(e.date)+' '+e.slot+': '+x.before.time+' '+x.before.title+' → '+x.after.time+' '+x.after.title}

  kindSel.onchange=()=>{if(allDayKinds.has(kindSel.value)){allday.checked=true;times.hidden=true}else if(allday.checked&&!ex){allday.checked=false;times.hidden=false}};
  const plus2h=t=>{const [hh,mm]=t.split(':').map(Number);return `${String((hh+2)%24).padStart(2,'0')}:${String(mm).padStart(2,'0')}`};
  const save=()=>{const title=$('#ed-title',box).value.trim();if(!title){close();return}const ev=ex||E(d,s,'practice','');const ad=allday.checked;const t=ad?'':$('#ed-time',box).value;const en=ad||!t?'':($('#ed-end',box).value||plus2h(t));const sd=$('#ed-date',box).value||d;let ed=$('#ed-enddate',box).value;if(ed&&ed<=sd)ed='';const ps=pickedSlots();const draft=$('#ed-draft',box).checked;Object.assign(ev,{title,kind:kindSel.value,time:t,end:en,place:$('#ed-place',box).value.trim(),date:sd,endDate:ed,slot:ps[0],slots:ps.length>1?ps:undefined,draft});if(!ex)targetList(c).push(ev);close();render();if(draft){toast('下書きとして保存しました（公開されません）');return}toast(ed?`${md(sd)}〜${md(ed)} の ${spanDays(ev)} 日間で保存しました`:ad?'終日の予定として保存しました':`保存しました（${t}〜${en}）`)};
  const close=()=>{box.remove();state.editing=null;td.classList.remove('editing')};
  $('#ed-save',box).onclick=save;$('#ed-cancel',box).onclick=()=>{close();render()};
  const del=$('#ed-del',box);if(del)del.onclick=()=>{const l=targetList(c);l.splice(l.indexOf(ex),1);close();render();toast('削除しました')};
  box.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();save()}if(e.key==='Escape'){close();render()}});
}
function targetList(c){const v=curVersion(c);return v?v.events:c.events}

/* ========== イベント結線 ========== */
function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  // 初回の案内
  document.querySelectorAll('[data-tourstart]').forEach(b=>b.onclick=()=>{if(!state.ws){state.ws=state.workspaces[0];state.hidden=new Set()}state.panel=null;state.tour={step:0};state.route='month';render()});
  document.querySelectorAll('[data-tournext]').forEach(b=>b.onclick=()=>{if(state.tour.step<TOUR.length-1){state.tour.step++;render()}else{state.tour=null;render();toast('案内は右上の「？ 使い方」からいつでも見られます')}});
  document.querySelectorAll('[data-tourprev]').forEach(b=>b.onclick=()=>{state.tour.step=Math.max(0,state.tour.step-1);render()});
  document.querySelectorAll('[data-tourend]').forEach(b=>b.onclick=()=>{state.tour=null;render()});
  document.querySelectorAll('[data-welcomeoff]').forEach(b=>b.onclick=()=>{state.welcomeDismissed=true;render()});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.ws=state.workspaces.find(w=>w.id===b.dataset.open);state.hidden=new Set();go('month')});
  document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{state.panel={kind:b.dataset.panel};render()});
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{state.panel=null;render()});
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{state.month=shiftMonth(state.month,Number(b.dataset.m));render()});
  document.querySelectorAll('[data-toggle]').forEach(b=>b.onchange=()=>{const id=b.dataset.toggle;state.hidden.has(id)?state.hidden.delete(id):state.hidden.add(id);render()});
  document.querySelectorAll('[data-slot]').forEach(b=>b.onchange=()=>{const k=b.dataset.slot;state.hiddenSlots.has(k)?state.hiddenSlots.delete(k):state.hiddenSlots.add(k);render()});
  document.querySelectorAll('[data-slotall]').forEach(b=>b.onclick=()=>{const [cid,mode]=b.dataset.slotall.split('|');for(const s of cal(cid).slots){mode==='on'?state.hiddenSlots.delete(cid+'|'+s):state.hiddenSlots.add(cid+'|'+s)}render()});
  document.querySelectorAll('[data-ver]').forEach(b=>b.onchange=()=>{state.versionIdx[b.dataset.ver]=Number(b.value);render()});
  document.querySelectorAll('[data-diff]').forEach(b=>b.onchange=()=>{state.diffCal=state.diffCal===b.dataset.diff?null:b.dataset.diff;render()});
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  document.querySelectorAll('[data-seediff]').forEach(b=>b.onclick=()=>{state.panel={kind:'approve',calId:b.dataset.seediff};state.diffCal=b.dataset.seediff;render()});
  document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const c=cal(b.dataset.approve);c.versions.forEach(v=>v.status='approved');state.panel=null;render();toast('反映しました。共有リンクと ICS にも反映されます')});
  document.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=()=>{state.shareLinks.splice(Number(b.dataset.revoke),1);render();toast('取り消しました')});
  // カレンダーの設定
  document.querySelectorAll('[data-calset]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();const c=cal(b.dataset.calset);const p={kind:'calset',calId:c.id,draft:{name:c.name,color:c.color,slots:c.slots.map(s=>({old:s,name:s}))}};if(b.dataset.addslot){p.draft.slots.push({old:null,name:''});p.focus=p.draft.slots.length-1}state.panel=p;render()});
  const cs=state.panel&&state.panel.kind==='calset'?state.panel:null;
  if(cs){const d=cs.draft;const sync=()=>{d.name=$('#cs-name').value;d.color=$('#cs-color').value;document.querySelectorAll('[data-csn]').forEach(i=>d.slots[Number(i.dataset.csn)].name=i.value)};
    document.querySelectorAll('[data-csn]').forEach(i=>i.oninput=sync);$('#cs-name').oninput=sync;$('#cs-color').oninput=sync;
    document.querySelectorAll('[data-csadd]').forEach(b=>b.onclick=()=>{sync();d.slots.push({old:null,name:''});cs.focus=d.slots.length-1;render()});
    document.querySelectorAll('[data-csup]').forEach(b=>b.onclick=()=>{sync();const i=Number(b.dataset.csup);[d.slots[i-1],d.slots[i]]=[d.slots[i],d.slots[i-1]];render()});
    document.querySelectorAll('[data-csdown]').forEach(b=>b.onclick=()=>{sync();const i=Number(b.dataset.csdown);[d.slots[i+1],d.slots[i]]=[d.slots[i],d.slots[i+1]];render()});
    document.querySelectorAll('[data-csdel]').forEach(b=>b.onclick=()=>{sync();const i=Number(b.dataset.csdel);const s=d.slots[i];const c=cal(cs.calId);if(!s.old||!eventsOf(c).some(e=>e.slot===s.old)){d.slots.splice(i,1)}else{s.deleting=true}render()});
    document.querySelectorAll('[data-cscancel]').forEach(b=>b.onclick=()=>{d.slots[Number(b.dataset.cscancel)].deleting=false;render()});
    document.querySelectorAll('[data-csmovego]').forEach(b=>b.onclick=()=>{sync();const i=Number(b.dataset.csmovego);const s=d.slots[i];const to=document.querySelector(`[data-csmove="${i}"]`).value;s.moveTo=to;s.remove=true;d.slots.splice(i,1);d.removed=(d.removed||[]).concat(s);render()});
    document.querySelectorAll('[data-csdrop]').forEach(b=>b.onclick=()=>{sync();const i=Number(b.dataset.csdrop);const s=d.slots[i];s.remove=true;s.drop=true;d.slots.splice(i,1);d.removed=(d.removed||[]).concat(s);render()});
    $('#cs-save').onclick=()=>{sync();const c=cal(cs.calId);const names=d.slots.map(s=>s.name.trim()).filter(Boolean);if(!names.length){toast('班は 1 つ以上必要です');return}
      const lists=[c.events,...c.versions.map(v=>v.events)];
      for(const s of d.slots)if(s.old&&s.old!==s.name.trim())for(const l of lists)for(const e of l)if(e.slot===s.old)e.slot=s.name.trim();
      for(const s of d.removed||[]){const target=s.moveTo?d.slots.find(x=>x.name===s.moveTo):null;for(const l of lists)for(let k=l.length-1;k>=0;k--){if(l[k].slot!==s.old)continue;if(s.drop)l.splice(k,1);else l[k].slot=(target?target.name.trim():names[0])}}
      const pm=document.querySelector('input[name=pubmode]:checked')?.value||'auto';if(pm==='manual'&&c.publishMode!=='manual'){c.publishMode='manual';publishNow(c)}else if(pm==='auto'){c.publishMode='auto';c.published=null}
      c.name=d.name.trim()||c.name;c.color=d.color;c.slots=[...new Set(names)];state.panel=null;render();toast('保存しました。表の列に反映されています')}}
  // 手動公開
  document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>{state.panel={kind:'publish',calId:b.dataset.publish};render()});
  const pubgo=$('#pub-go');if(pubgo)pubgo.onclick=()=>{const c=cal(state.panel.calId);publishNow(c);state.panel=null;render();toast('公開しました。リンク・ICS・PDF に反映されます')};
  document.querySelectorAll('[data-publiconly]').forEach(b=>b.onchange=()=>{state.showPublicOnly=b.checked;render()});
  document.querySelectorAll('td.cell').forEach(td=>td.onclick=e=>{if(e.target.closest('.editor'))return;openEditor(td)});
  const fws=$('#f-newws');if(fws)fws.onsubmit=e=>{e.preventDefault();const name=$('#ws-name').value.trim()||'新しい予定表';const w={id:'w'+Date.now(),name,calendars:[],members:[{name:'あなた',email:'',role:'管理者',grants:'すべて'}]};state.workspaces.push(w);state.ws=w;state.hidden=new Set();go('month');toast(`「${name}」を作りました。まずカレンダーを 1 つ作りましょう`)};
  const fcal=$('#f-addcal');if(fcal){fcal.querySelectorAll('.choice input').forEach(r=>r.onchange=()=>{fcal.querySelectorAll('.choice').forEach(x=>x.classList.toggle('on',x.querySelector('input').checked))});
    fcal.onsubmit=e=>{e.preventDefault();const name=$('#c-name').value.trim();if(!name)return;const slots=$('#c-slots').value.split(/[,、]/).map(s=>s.trim()).filter(Boolean);const src=fcal.querySelector('input[name=src]:checked').value;const c={id:'c'+Date.now(),name,color:$('#c-color').value,slots:slots.length?slots:['全体'],source:src,events:[],versions:[]};ws().calendars.push(c);
      if(src==='pdf'||src==='sheet'){state.panel={kind:'import',calId:c.id};render();toast(`「${name}」を作りました。続けて取り込みます`)}else if(src==='template'){state.panel=null;render();toast(`「${name}」を作りました。入力用シートのリンクを顧問に送れます（試作では省略）`)}else{state.panel=null;render();toast(`「${name}」を作りました。表のマスをクリックして書けます`)}}}
  const drop=$('#drop');if(drop){['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('on')}));['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('on')}));drop.addEventListener('drop',e=>startImport(e.dataTransfer.files[0]?.name));$('#imp-file').onchange=e=>startImport(e.target.files[0]?.name);$('#imp-url-go').onclick=()=>startImport('Google シート');$('#imp-demo').onclick=()=>startImport('10月予定 ③.pdf')}
  const apply=$('#imp-apply');if(apply)apply.onclick=()=>{const p=state.panel;const c=cal(p.calId);const rows=p.rows.map((e,i)=>({...e,kind:document.querySelector(`[data-rk="${i}"]`).value,time:document.querySelector(`[data-rt="${i}"]`).textContent.trim(),title:document.querySelector(`[data-rn="${i}"]`).textContent.trim(),place:document.querySelector(`[data-rp="${i}"]`).textContent.trim()}));const pending=$('#imp-pending').checked;c.versions.push({label:p.fileName||'取り込み','events':rows,status:pending?'pending':'approved'});state.versionIdx[c.id]=c.versions.length-1;state.diffCal=c.versions.length>1?c.id:null;state.panel=null;render();toast(pending?'確認待ちにしました。顧問が反映すると公開されます':'反映しました。前の版との違いを色で表示しています')};
  bindSlotPicks(document);
  const inShare=state.panel&&state.panel.kind==='share';
  if(inShare){
    document.querySelectorAll('[data-shtab]').forEach(b=>b.onclick=()=>{state.panel=shareState({tab:b.dataset.shtab});render()});
    document.querySelectorAll('[data-shsel]').forEach(b=>b.onchange=()=>{state.panel=shareState();render()});
    // 班のチェック（全部 / なし を含む）が変わったら、下のタブに反映
    document.querySelectorAll('.panel .slotpick input').forEach(b=>b.addEventListener('change',()=>{state.panel=shareState();render()}));
    document.querySelectorAll('.panel [data-pickall],.panel [data-picknone]').forEach(b=>b.addEventListener('click',()=>{setTimeout(()=>{state.panel=shareState();render()},0)}));
    const shf=$('#sh-from');if(shf){shf.onchange=()=>{state.panel=shareState();render()};$('#sh-to').onchange=()=>{state.panel=shareState();render()}}
    const mk=$('#sh-make');if(mk)mk.onclick=()=>{const st=shareState();const cs=ws().calendars.filter(c=>st.sel.has(c.id));const scope=cs.length===ws().calendars.length&&cs.every(c=>!st.slotSel[c.id]||st.slotSel[c.id].length===c.slots.length)?'すべて':cs.map(c=>st.slotSel[c.id]&&st.slotSel[c.id].length<c.slots.length?`${c.name}（${st.slotSel[c.id].join('・')}）`:c.name).join('・');state.shareLinks.unshift({label:$('#sh-label').value.trim()||'共有リンク',scope:scope+(st.from||st.to?` / ${md(st.from)}〜${md(st.to)}`:''),token:Math.random().toString(16).slice(2,6)+'…'+Math.random().toString(16).slice(2,6)});state.panel=st;render();toast('リンクを作りました')};
    const pl=$('#pdf-layout');if(pl){pl.onchange=()=>{state.panel=shareState({layout:pl.value});render()};$('#pdf-paper').onchange=()=>{state.panel=shareState({paper:$('#pdf-paper').value});render()}}
    const big=$('#pdf-big');if(big)big.onclick=()=>{const st=shareState();state.pdfModal={sel:st.sel,slotSel:st.slotSel,from:st.from,to:st.to,layout:st.layout||'月間表',paper:st.paper||'A4 横'};state.panel=st;render()};
  }
  document.querySelectorAll('#pdf-save,[data-pdfsave]').forEach(b=>b.onclick=()=>toast('試作では保存できません。実装では PDF が保存されます'));
  document.querySelectorAll('[data-pdfclose]').forEach(b=>b.onclick=()=>{state.pdfModal=null;render()});
  const pml=$('#pm-layout');if(pml){pml.onchange=()=>{state.pdfModal.layout=pml.value;render()};$('#pm-paper').onchange=()=>{state.pdfModal.paper=$('#pm-paper').value;render()}}
  window.onresize=()=>fitPages(document);
  const inv=$('#f-invite');if(inv)inv.onsubmit=e=>{e.preventDefault();const mail=$('#inv-mail').value;const cs=[...inv.querySelectorAll('[data-inv]:checked')].map(x=>cal(x.dataset.inv).name);ws().members.push({name:mail.split('@')[0],email:mail+'（招待中）',role:'編集',grants:cs.length?cs.join('・'):'閲覧のみ'});render();toast(`${mail} に招待メールを送りました（試作）`)};
}
function currentSel(){const s=new Set();document.querySelectorAll('[data-shsel]').forEach(b=>{if(b.checked)s.add(b.dataset.shsel)});return s.size?s:(state.panel.sel||new Set(ws().calendars.map(c=>c.id)))}
/* 共有パネルの班チェックの状態 {calId: [班...]}。画面に出ていないカレンダーは前の状態を引き継ぐ */
function currentSlotSel(){const out={...(state.panel.slotSel||{})};for(const c of ws().calendars){const boxes=document.querySelectorAll('.sh-slot-'+c.id);if(boxes.length)out[c.id]=[...boxes].filter(b=>b.checked).map(b=>b.value)}return out}
function shareState(extra){return {...state.panel,sel:currentSel(),slotSel:currentSlotSel(),from:$('#sh-from')?.value||state.panel.from,to:$('#sh-to')?.value||state.panel.to,...extra}}
function startImport(fileName){const p=state.panel;const calId=$('#imp-cal')?.value||p.calId||'soccer';state.panel={kind:'import',step:2,fileName,calId};render();
  const texts=['ページを画像にしています…','表の列と班の対応を読んでいます…','結合セル（大会日・OFF）を各班に展開しています…','前の版と突き合わせています…'];let i=0;
  const t=setInterval(()=>{i++;const bar=$('#prog');if(bar)bar.style.width=Math.min(100,i*25)+'%';const tx=$('#prog-text');if(tx)tx.textContent=texts[Math.min(i,texts.length-1)];
    if(i>=4){clearInterval(t);const c=cal(calId);let rows;if(c.id==='soccer'||c.slots.length>1)rows=SOCCER_V3.map(e=>({...e,id:'n'+e.id,slot:c.id==='soccer'?e.slot:c.slots[Math.min(c.slots.length-1,['トップ','サテライト','セカンド','朝練'].indexOf(e.slot))]}));else rows=TRACK.map(e=>({...e,id:'n'+e.id,slot:c.slots[0]}));
      const prev=c.versions[c.versions.length-1];let changes=0;if(prev){const A=new Map(prev.events.map(e=>[e.date+'|'+e.slot,e]));for(const e of rows){const a=A.get(e.date+'|'+e.slot);if(!a||a.title!==e.title||a.time!==e.time)changes++}}
      state.panel={kind:'import',step:3,fileName,calId,rows,changes};render()}},550)}

/* ========== 起動 ========== */
(function(){try{const hsh=location.hash.replace('#','');if(hsh==='month'){state.ws=state.workspaces[0];state.route='month'}}catch{}render()})();
</script>
